name: Rilis APK
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: miko-ai-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Gerbang kualitas — runtime JS harus sama dengan Python
        run: node runtime/test_parity.mjs release
      - name: Uji pemeriksa update APK
        run: node runtime/test_update_check.mjs
      - name: Uji router online/offline dan Worker
        run: node runtime/test_online_router.mjs
      - name: Pasang dependency aplikasi
        working-directory: app
        run: npm install
      - name: Siapkan aplikasi web (runtime + model)
        run: bash scripts/prepare_app.sh
      - name: Publikasikan remote hot-update bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/miko-remote && mkdir -p /tmp/miko-remote
          cp -a app/www/. /tmp/miko-remote/
          cd /tmp/miko-remote
          git init -b remote
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "remote: bundle from $GITHUB_SHA"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:remote
      - name: Bungkus jadi APK (Capacitor)
        working-directory: app
        run: |
          npx cap add android
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          code = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          s, n1 = re.subn(r"versionCode\s+\d+", f"versionCode {code}", s, count=1)
          s, n2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "1.0.{code}"', s, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("versionCode/versionName tidak ditemukan")
          p.write_text(s)
          print(f"Android versionName=1.0.{code}, versionCode={code}")
          PY
          cd .. && bash scripts/install_auto_update_android.sh
          cd app
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Ganti nama APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Miko-AI-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            Miko-AI-${{ github.ref_name }}.apk
            release/model.json
            release/model.bin
            release/tokenizer.json
      - name: Perbarui release otomatis latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Miko AI — latest
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body: |
            Build otomatis dari commit `${{ github.sha }}` pada branch `main`.
            Release ini diperbarui setiap ada perubahan yang masuk ke `main`.
          files: |
            Miko-AI-${{ github.ref_name }}.apk
            release/model.json
            release/model.bin
            release/tokenizer.json
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: apk
          path: Miko-AI-*.apk
