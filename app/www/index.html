<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Miko AI</title>
<style>
:root{color-scheme:dark}
body{margin:0;font:16px system-ui;background:#0f1419;color:#e6edf3;display:flex;flex-direction:column;height:100dvh}
header{padding:12px 16px;border-bottom:1px solid #30363d;font-weight:600}
#log{flex:1;overflow:auto;padding:12px 16px}
.m{margin:0 0 12px;padding:10px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.u{background:#1f6feb33}.a{background:#161b22;font-family:ui-monospace,monospace;font-size:14px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #30363d}
input{flex:1;padding:10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:inherit;font:inherit}
button{padding:10px 16px;border:0;border-radius:8px;background:#2f81f7;color:#fff;font:inherit}
#st{font-size:12px;color:#8b949e;padding:0 16px 6px}
</style></head><body>
<header>Miko AI · khusus coding</header>
<div id="st">Memuat model…</div>
<div id="upd" hidden style="padding:8px 16px;background:#3d2e00;color:#ffd666;font-size:13px"></div>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Tanya soal kode…" autocomplete="off"><button>Kirim</button></form>
<script type="module">
import { loadModel } from "./ai/miko-ai-lm.js";
import { reply } from "./ai/assistant.js";
const log = document.getElementById("log"), st = document.getElementById("st");
const upd = document.getElementById("upd");
const add = (cls, txt = "") => { const d = document.createElement("div"); d.className = "m " + cls; d.textContent = txt; log.append(d); log.scrollTop = log.scrollHeight; return d; };
async function checkUpdate() {
  try {
    const local = await fetch(`./build.json?${Date.now()}`).then((r) => r.ok ? r.json() : null);
    if (!local) return;
    const remote = await fetch("https://api.github.com/repos/v1-byte/Miko-Ai/releases/tags/latest", { headers: { Accept: "application/vnd.github+json" } }).then((r) => r.ok ? r.json() : null);
    if (!remote || !remote.published_at || remote.body?.includes(`commit \`${local.commit}\``)) return;
    upd.hidden = false;
    upd.innerHTML = `Versi baru Miko AI tersedia. <button id="updateBtn" style="padding:4px 8px;margin-left:6px">Unduh & instal</button>`;
    document.getElementById("updateBtn").onclick = () => { window.open(local.updateUrl, "_blank"); };
  } catch (_) { /* Update opsional; aplikasi tetap berjalan offline. */ }
}
let lm;
try { lm = await loadModel("./model/"); st.textContent = `Model siap · versi ${lm.version} · ${(lm.cfg.n_layer)} layer`; }
catch (e) { st.textContent = "Gagal memuat model: " + e.message; }
checkUpdate();
f.onsubmit = async (e) => {
  e.preventDefault();
  if (!lm || !q.value.trim()) return;
  const msg = q.value.trim(); q.value = "";
  add("u", msg); const out = add("a");
  try {
    for await (const d of reply(lm, msg)) { out.textContent += d; log.scrollTop = log.scrollHeight; }
    if (!out.textContent) out.textContent = "Miko AI belum memiliki jawaban.";
  } catch (err) {
    out.textContent = `Miko AI mengalami error: ${err.message}`;
  }
};
</script></body></html>
